<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>شرح الدروس</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Reem+Kufi:wght@500;700&display=swap">
<style>
:root{
  color-scheme:light dark;
  --bg:#f3f5f1; --surface:#ffffff; --fg:#1b2a26; --muted:#5d6f69; --line:#d9e0da;
  --accent:#1f5d4a; --chalk:#f0b429; --chalk-fg:#3a2a00;
  --font-display:'Reem Kufi','IBM Plex Sans Arabic',system-ui,sans-serif;
  --font-body:'IBM Plex Sans Arabic',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#12201c; --surface:#192b26; --fg:#e9efeb; --muted:#9fb2aa; --line:#2b403a; --accent:#5fbf9d;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:16px;line-height:1.6;padding:24px 16px}
.wrap{max-width:720px;margin-inline:auto;display:flex;flex-direction:column;gap:28px}
h1{font-family:var(--font-display);font-weight:700;font-size:clamp(28px,6vw,40px);line-height:1.2;margin:0;text-wrap:balance}
header p{margin:6px 0 0;color:var(--muted)}
h2{font-family:var(--font-display);font-weight:500;font-size:18px;margin:0 0 10px;color:var(--accent);display:flex;align-items:center;gap:10px}
h2::after{content:"";flex:1;height:1px;background:var(--line)}
ul{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.row{display:flex;gap:16px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.row.today{border-color:var(--chalk);box-shadow:0 0 0 2px var(--chalk)}
.stamp{flex:none;width:64px;text-align:center;border-inline-end:1px solid var(--line);padding-inline-end:14px;font-variant-numeric:tabular-nums}
.stamp .d{font-family:var(--font-display);font-weight:700;font-size:30px;line-height:1.1}
.stamp .m{font-size:13px;color:var(--muted)}
.body{min-width:0;flex:1;display:flex;flex-direction:column;gap:8px}
.title{font-weight:600;font-size:18px;overflow-wrap:anywhere}
.meta{font-size:13px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:color-mix(in srgb,var(--accent) 14%,transparent);border-radius:999px;padding:2px 12px;font-size:14px}
.badge{align-self:flex-start;background:var(--chalk);color:var(--chalk-fg);border-radius:6px;padding:0 8px;font-size:12px;font-weight:600}
.badge.ok{background:var(--accent);color:var(--surface)}
.row.done .stamp,.row.done .title{opacity:.65}
.empty{border:1px dashed var(--line);border-radius:10px;padding:28px 16px;text-align:center;color:var(--muted)}
@media (max-width:420px){.stamp{width:52px;padding-inline-end:10px}.row{gap:12px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>شرح الدروس</h1>
    <p>الدروس اللي بيشرحها الطلاب في المدرسة، ومن بيشرح كل درس، وتاريخه.</p>
  </header>
  <main id="out"></main>
</div>
<script src="lessons.js"></script>
<script>
(function(){
  var out = document.getElementById('out');
  var fmtMonth = new Intl.DateTimeFormat('ar-SA-u-ca-gregory-nu-latn', {month:'long'});
  var fmtFull = new Intl.DateTimeFormat('ar-SA-u-ca-gregory-nu-latn', {weekday:'long', year:'numeric'});
  var n = new Date();
  var today = n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')+'-'+String(n.getDate()).padStart(2,'0');

  function el(tag, cls, text){ var e = document.createElement(tag); if(cls) e.className = cls; if(text != null) e.textContent = text; return e; }

  function row(l){
    var p = l.date.split('-').map(Number), d = new Date(p[0], p[1]-1, p[2]);
    var isToday = l.date === today;
    var li = el('li', 'row' + (isToday && !l.done ? ' today' : '') + (l.done ? ' done' : ''));
    var stamp = el('div', 'stamp');
    stamp.appendChild(el('div', 'd', String(p[2])));
    stamp.appendChild(el('div', 'm', fmtMonth.format(d)));
    li.appendChild(stamp);
    var body = el('div', 'body');
    if(l.done) body.appendChild(el('span', 'badge ok', '✓ تم الشرح'));
    else if(isToday) body.appendChild(el('span', 'badge', 'اليوم'));
    body.appendChild(el('div', 'title', l.title));
    var chips = el('div', 'chips');
    l.students.forEach(function(s){ chips.appendChild(el('span', 'chip', s)); });
    body.appendChild(chips);
    body.appendChild(el('div', 'meta', fmtFull.format(d)));
    li.appendChild(body);
    return li;
  }

  function group(title, items){
    var s = el('section');
    s.appendChild(el('h2', null, title));
    var ul = el('ul');
    items.forEach(function(l){ ul.appendChild(row(l)); });
    s.appendChild(ul);
    out.appendChild(s);
  }

  var all = (typeof LESSONS !== 'undefined' ? LESSONS : []).slice();
  var upcoming = all.filter(function(l){ return l.date >= today; }).sort(function(a,b){ return a.date < b.date ? -1 : 1; });
  var past = all.filter(function(l){ return l.date < today; }).sort(function(a,b){ return a.date < b.date ? 1 : -1; });

  if(!all.length) out.appendChild(el('div', 'empty', 'ما فيه دروس مضافة للحين. ارجع بعدين.'));
  out.style.display = 'flex'; out.style.flexDirection = 'column'; out.style.gap = '28px';
  if(upcoming.length) group('الدروس القادمة', upcoming);
  if(past.length) group('الدروس السابقة', past);
})();
</script>
</body>
</html>
