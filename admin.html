<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>إدارة الدروس</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Reem+Kufi:wght@500;700&display=swap">
<style>
:root{
  color-scheme:light dark;
  --bg:#f3f5f1; --surface:#ffffff; --fg:#1b2a26; --muted:#5d6f69; --line:#d9e0da;
  --accent:#1f5d4a; --accent-fg:#ffffff; --danger:#a63b2b; --chalk:#f0b429;
  --font-display:'Reem Kufi','IBM Plex Sans Arabic',system-ui,sans-serif;
  --font-body:'IBM Plex Sans Arabic',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#12201c; --surface:#192b26; --fg:#e9efeb; --muted:#9fb2aa; --line:#2b403a;
  --accent:#5fbf9d; --accent-fg:#08201a; --danger:#e58a79;
}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:16px;line-height:1.6;padding:24px 16px}
.wrap{max-width:720px;margin-inline:auto;display:flex;flex-direction:column;gap:24px}
h1{font-family:var(--font-display);font-weight:700;font-size:clamp(26px,6vw,36px);line-height:1.2;margin:0}
h2{font-family:var(--font-display);font-weight:500;font-size:18px;margin:0}
p{margin:0}
.muted{color:var(--muted);font-size:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:grid;gap:12px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
label{font-size:13px;color:var(--muted)}
input[type=text],input[type=password],input[type=date]{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 12px;width:100%;min-width:0}
input[type=date]{-webkit-appearance:none;appearance:none;display:block;max-width:100%;min-height:44px;text-align:right}
input[type=date]::-webkit-date-and-time-value{text-align:right}
.ltr{direction:ltr;text-align:left}
.check{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--muted)}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:none;color:var(--fg);padding:8px 14px}
button.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:600;padding:10px 16px}
button:disabled{opacity:.6;cursor:default}
button.danger{color:var(--danger)}
:focus-visible{outline:2px solid var(--chalk);outline-offset:2px}
.list{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.item{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.item .info{flex:1;min-width:200px;display:flex;flex-direction:column}
.item .t{font-weight:600;overflow-wrap:anywhere}
.item.done .t{opacity:.6;text-decoration:line-through}
.item .btns{display:flex;gap:6px}
.status{min-height:1.4em;font-size:14px}
.status.err{color:var(--danger)}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:24px}
.ver{font-size:11px;color:var(--muted);text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>إدارة الدروس</h1>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button id="relink" type="button" hidden>تغيير المفتاح</button>
      <button id="logout" type="button" hidden>تسجيل خروج</button>
    </div>
  </div>

  <!-- 1) اسم المستخدم وكلمة المرور -->
  <form id="gate" class="card" hidden>
    <h2>تسجيل الدخول</h2>
    <div class="field"><label for="user">اسم المستخدم</label>
      <input id="user" type="text" class="ltr" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false"></div>
    <div class="field"><label for="pass">كلمة المرور</label>
      <input id="pass" type="password" class="ltr" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false"></div>
    <label class="check"><input id="showpass" type="checkbox"> إظهار كلمة المرور</label>
    <button class="primary" type="submit">دخول</button>
    <div class="status" id="gateStatus"></div>
  </form>

  <!-- 2) ربط GitHub (مرة وحدة) -->
  <form id="link" class="card" hidden>
    <h2>ربط GitHub (مرة وحدة)</h2>
    <p class="muted">الصفحة تحفظ التعديلات في GitHub، فتحتاج مفتاح الوصول (Token) حقك. ينحفظ في هذا المتصفح فقط.</p>
    <div class="field"><label for="repo">اسم المستودع (مثال: saad/lessons)</label>
      <input id="repo" type="text" class="ltr" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="username/repo"></div>
    <div class="field"><label for="token">مفتاح الوصول</label>
      <input id="token" type="password" class="ltr" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="github_pat_..."></div>
    <button class="primary" type="submit">حفظ والمتابعة</button>
    <div class="status" id="linkStatus"></div>
  </form>

  <!-- 3) لوحة الدروس -->
  <div id="panel" class="stack" hidden>
    <form id="add" class="card">
      <h2>إضافة درس</h2>
      <div class="field"><label for="title">اسم الدرس</label><input id="title" type="text" placeholder="مثال: الكسور العشرية"></div>
      <div class="field"><label for="students">الطلاب اللي بيشرحونه (افصل بينهم بفاصلة)</label><input id="students" type="text" placeholder="مثال: أحمد، خالد، فهد"></div>
      <div class="field"><label for="date">تاريخ الدرس</label><input id="date" type="date"></div>
      <button class="primary" id="addBtn" type="submit">إضافة</button>
      <button id="cancelEdit" type="button" hidden>إلغاء التعديل</button>
      <div class="status" id="status"></div>
    </form>
    <section style="display:flex;flex-direction:column;gap:10px">
      <h2>الدروس المضافة</h2>
      <ul class="list" id="list"></ul>
    </section>
  </div>

  <div class="ver">النسخة 4</div>
</div>

<script>
(function(){
  var FILE = 'lessons.js';
  // بصمة (اسم المستخدم + كلمة المرور) بحروف صغيرة، فالحروف الكبيرة والصغيرة ما تفرق
  var HASH = '75d41e5d75c4936a0ab86a8500f16a993319b2574f892a53edd23ab9039f6d1d';
  var $ = function(id){ return document.getElementById(id); };
  var lessons = [], sha = null, busy = false, editing = null;

  /* ---------- أدوات ---------- */
  function store(k, v){
    try{
      if(v === undefined) return localStorage.getItem(k);
      if(v === null) localStorage.removeItem(k); else localStorage.setItem(k, v);
    }catch(e){}
    return null;
  }
  function session(k, v){
    try{
      if(v === undefined) return sessionStorage.getItem(k);
      if(v === null) sessionStorage.removeItem(k); else sessionStorage.setItem(k, v);
    }catch(e){}
    return null;
  }
  function say(id, msg, err){ var e = $(id); e.textContent = msg || ''; e.className = 'status' + (err ? ' err' : ''); }

  // SHA-256 مكتوبة داخل الصفحة، ما تعتمد على المتصفح
  function sha256(s){
    var K = [0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
    var H = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
    var b = Array.from(new TextEncoder().encode(s)), l = b.length * 8;
    b.push(0x80); while(b.length % 64 !== 56) b.push(0);
    var hi = Math.floor(l / 4294967296), lo = l >>> 0;
    [hi, lo].forEach(function(v){ b.push((v >>> 24) & 255, (v >>> 16) & 255, (v >>> 8) & 255, v & 255); });
    function r(x, n){ return (x >>> n) | (x << (32 - n)); }
    for(var i = 0; i < b.length; i += 64){
      var w = [], t;
      for(t = 0; t < 16; t++) w[t] = (b[i+4*t] << 24) | (b[i+4*t+1] << 16) | (b[i+4*t+2] << 8) | b[i+4*t+3];
      for(t = 16; t < 64; t++){
        var s0 = r(w[t-15], 7) ^ r(w[t-15], 18) ^ (w[t-15] >>> 3), s1 = r(w[t-2], 17) ^ r(w[t-2], 19) ^ (w[t-2] >>> 10);
        w[t] = (w[t-16] + s0 + w[t-7] + s1) | 0;
      }
      var a = H[0], bb = H[1], c = H[2], d = H[3], e = H[4], f = H[5], g = H[6], h = H[7];
      for(t = 0; t < 64; t++){
        var S1 = r(e, 6) ^ r(e, 11) ^ r(e, 25), ch = (e & f) ^ (~e & g), t1 = (h + S1 + ch + K[t] + w[t]) | 0;
        var S0 = r(a, 2) ^ r(a, 13) ^ r(a, 22), mj = (a & bb) ^ (a & c) ^ (bb & c), t2 = (S0 + mj) | 0;
        h = g; g = f; f = e; e = (d + t1) | 0; d = c; c = bb; bb = a; a = (t1 + t2) | 0;
      }
      H = [(H[0]+a)|0, (H[1]+bb)|0, (H[2]+c)|0, (H[3]+d)|0, (H[4]+e)|0, (H[5]+f)|0, (H[6]+g)|0, (H[7]+h)|0];
    }
    return H.map(function(x){ return ('00000000' + (x >>> 0).toString(16)).slice(-8); }).join('');
  }

  // يوحّد اللي تكتبه لوحة المفاتيح: أرقام عربية، نقطة عربية، رموز مخفية، مسافات
  function clean(s){
    return String(s || '').normalize('NFKC')
      .replace(/[​-‏‪-‮⁦-⁩﻿]/g, '')
      .replace(/[٠-٩]/g, function(c){ return String(c.charCodeAt(0) - 0x0660); })
      .replace(/[۰-۹]/g, function(c){ return String(c.charCodeAt(0) - 0x06F0); })
      .replace(/[٫۔。]/g, '.')
      .trim().toLowerCase();
  }

  /* ---------- GitHub ---------- */
  function api(path, opts){
    opts = opts || {};
    opts.headers = Object.assign({
      'Accept': 'application/vnd.github+json',
      'Authorization': 'Bearer ' + store('token'),
      'X-GitHub-Api-Version': '2022-11-28'
    }, opts.headers || {});
    opts.cache = 'no-store';
    return fetch('https://api.github.com/repos/' + store('repo') + '/contents/' + path, opts);
  }
  function fromB64(b){
    var bin = atob(b.replace(/\n/g, ''));
    return new TextDecoder().decode(Uint8Array.from(bin, function(c){ return c.charCodeAt(0); }));
  }
  function toB64(s){
    var bin = ''; new TextEncoder().encode(s).forEach(function(x){ bin += String.fromCharCode(x); });
    return btoa(bin);
  }
  function serialize(list){
    return '// هذا الملف تعدله صفحة admin.html تلقائيًا.\n\nconst LESSONS = ' + JSON.stringify(list, null, 2) + ';\n';
  }
  function parse(text){
    var i = text.indexOf('const LESSONS'); if(i < 0) throw new Error('badfile');
    var j = text.indexOf('=', i), k = text.lastIndexOf(';');
    var out = (new Function('return ' + text.slice(j + 1, k)))();
    if(!Array.isArray(out)) throw new Error('badfile');
    return out;
  }
  async function load(){
    var r = await api(FILE);
    if(r.status === 401 || r.status === 403) throw new Error('auth');
    if(r.status === 404) throw new Error('notfound');
    if(!r.ok) throw new Error('http');
    var j = await r.json();
    sha = j.sha;
    lessons = parse(fromB64(j.content));
  }
  async function save(message){
    var r = await api(FILE, {method: 'PUT', body: JSON.stringify({message: message, content: toB64(serialize(lessons)), sha: sha})});
    if(r.status === 409 || r.status === 422) throw new Error('conflict');
    if(r.status === 401 || r.status === 403) throw new Error('auth');
    if(!r.ok) throw new Error('http');
    sha = (await r.json()).content.sha;
  }
  function errText(e){
    if(e.message === 'auth') return 'المفتاح غير صحيح أو ما عنده صلاحية على هذا المستودع.';
    if(e.message === 'notfound') return 'ما لقيت المستودع أو الملف lessons.js. تأكد من اسم المستودع.';
    if(e.message === 'conflict') return 'الملف تغيّر من مكان ثاني. حدّث الصفحة وحاول مرة ثانية.';
    if(e.message === 'badfile') return 'شكل الملف lessons.js تغيّر ولا قدرت أقرأه.';
    return 'صار خطأ في الاتصال. حاول مرة ثانية.';
  }

  /* ---------- العرض ---------- */
  function show(which){
    $('gate').hidden = which !== 'gate';
    $('link').hidden = which !== 'link';
    $('panel').hidden = which !== 'panel';
    $('logout').hidden = which === 'gate';
    $('relink').hidden = which !== 'panel';
  }
  function fmt(iso){
    var p = iso.split('-').map(Number);
    return new Intl.DateTimeFormat('ar-SA-u-ca-gregory-nu-latn', {day: 'numeric', month: 'long', year: 'numeric'}).format(new Date(p[0], p[1]-1, p[2]));
  }
  function renderList(){
    var ul = $('list'); ul.textContent = '';
    if(!lessons.length){
      var e = document.createElement('li'); e.className = 'muted'; e.textContent = 'ما فيه دروس بعد.'; ul.appendChild(e); return;
    }
    lessons.slice().sort(function(a, b){ return a.date < b.date ? 1 : -1; }).forEach(function(l){
      var li = document.createElement('li'); li.className = 'item' + (l.done ? ' done' : '');
      var info = document.createElement('div'); info.className = 'info';
      var t = document.createElement('span'); t.className = 't'; t.textContent = l.title;
      var m = document.createElement('span'); m.className = 'muted'; m.textContent = l.students.join('، ') + ' · ' + fmt(l.date);
      info.appendChild(t); info.appendChild(m);
      var btns = document.createElement('div'); btns.className = 'btns';
      var d = document.createElement('button'); d.type = 'button'; d.textContent = l.done ? 'إلغاء تم الشرح' : 'تم الشرح';
      d.addEventListener('click', function(){ change(function(){ if(l.done) delete l.done; else l.done = true; }, 'تحديث حالة: ' + l.title); });
      var ed = document.createElement('button'); ed.type = 'button'; ed.textContent = 'تعديل';
      ed.addEventListener('click', function(){ startEdit(l); });
      var x = document.createElement('button'); x.type = 'button'; x.className = 'danger'; x.textContent = 'حذف';
      x.addEventListener('click', function(){
        if(x.dataset.sure !== '1'){
          x.dataset.sure = '1'; x.textContent = 'تأكيد الحذف';
          setTimeout(function(){ x.dataset.sure = ''; x.textContent = 'حذف'; }, 3000);
          return;
        }
        change(function(){ lessons.splice(lessons.indexOf(l), 1); }, 'حذف درس: ' + l.title);
      });
      btns.appendChild(d); btns.appendChild(ed); btns.appendChild(x);
      li.appendChild(info); li.appendChild(btns); ul.appendChild(li);
    });
  }
  function startEdit(l){
    editing = l;
    $('title').value = l.title;
    $('students').value = l.students.join('، ');
    $('date').value = l.date;
    $('addBtn').textContent = 'حفظ التعديل';
    $('cancelEdit').hidden = false;
    say('status', 'تعدّل الحين على: ' + l.title);
    $('add').scrollIntoView({behavior: 'smooth', block: 'start'});
  }
  function stopEdit(){
    editing = null;
    $('title').value = ''; $('students').value = '';
    $('addBtn').textContent = 'إضافة';
    $('cancelEdit').hidden = true;
  }
  async function change(fn, msg){
    if(busy) return false;
    busy = true; say('status', 'جاري الحفظ…');
    var ok = false;
    try{ fn(); await save(msg); renderList(); say('status', 'تم الحفظ. يظهر في الموقع بعد دقيقة تقريبًا.'); ok = true; }
    catch(e){ say('status', errText(e), true); try{ await load(); renderList(); }catch(_){} }
    busy = false;
    return ok;
  }

  /* ---------- الأحداث ---------- */
  $('showpass').addEventListener('change', function(){ $('pass').type = this.checked ? 'text' : 'password'; });

  $('gate').addEventListener('submit', function(e){
    e.preventDefault();
    var good = false;
    try{ good = sha256('lessons-admin|' + clean($('user').value) + '|' + clean($('pass').value)) === HASH; }
    catch(err){ say('gateStatus', 'خطأ في المتصفح: ' + err.message, true); return; }
    if(!good){ say('gateStatus', 'اسم المستخدم أو كلمة المرور غير صحيحة.', true); return; }
    session('auth', '1'); say('gateStatus', ''); start();
  });

  $('link').addEventListener('submit', async function(e){
    e.preventDefault();
    var repo = $('repo').value.trim(), token = $('token').value.trim();
    if(!repo || !token){ say('linkStatus', 'اكتب اسم المستودع والمفتاح.', true); return; }
    store('repo', repo); store('token', token);
    say('linkStatus', 'جاري التحقق…');
    try{ await load(); $('token').value = ''; say('linkStatus', ''); show('panel'); renderList(); }
    catch(err){ say('linkStatus', errText(err), true); store('token', null); }
  });

  $('relink').addEventListener('click', function(){
    store('token', null); $('repo').value = store('repo') || ''; $('token').value = ''; say('linkStatus', ''); show('link');
  });

  $('logout').addEventListener('click', function(){ session('auth', null); lessons = []; $('pass').value = ''; show('gate'); });

  $('add').addEventListener('submit', async function(e){
    e.preventDefault();
    var title = $('title').value.trim();
    var students = $('students').value.split(/[,،]/).map(function(s){ return s.trim(); }).filter(Boolean);
    var date = $('date').value;
    if(!title || !students.length || !date){ say('status', 'عبّ كل الخانات.', true); return; }
    var target = editing && lessons.indexOf(editing) >= 0 ? editing : null;
    var ok;
    if(target){
      ok = await change(function(){ target.title = title; target.students = students; target.date = date; }, 'تعديل درس: ' + title);
    }else{
      ok = await change(function(){ lessons.push({title: title, students: students, date: date}); }, 'إضافة درس: ' + title);
    }
    if(ok) stopEdit();
  });

  $('cancelEdit').addEventListener('click', function(){ stopEdit(); say('status', ''); });

  /* ---------- البداية ---------- */
  async function start(){
    var n = new Date();
    if(!$('date').value) $('date').value = n.getFullYear() + '-' + String(n.getMonth()+1).padStart(2, '0') + '-' + String(n.getDate()).padStart(2, '0');
    if(store('repo') && store('token')){
      try{ await load(); show('panel'); renderList(); return; }catch(e){}
    }
    $('repo').value = store('repo') || '';
    show('link');
  }

  if(session('auth') === '1') start(); else show('gate');
})();
</script>
</body>
</html>
